<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MeroTable – Header Right</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    background: #f0f2f8;
    font-family: 'Inter', sans-serif;
  }

  /* ── Demo shell mimicking the MeroTable layout ── */
  .demo-topbar {
    background: #ffffff;
    border-bottom: 1px solid #e8eaf0;
    padding: 0 28px;
    height: 60px;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .page-title {
    font-size: 20px;
    font-weight: 700;
    color: #1a1d2e;
    letter-spacing: -0.3px;
  }

  /* ════════════════════════════
     HEADER RIGHT
  ════════════════════════════ */
  .header-right {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  /* ── Subscription pill ── */
  .subscription-pill {
    display: flex;
    align-items: stretch;
    border-radius: 10px;
    border: 1.5px solid #e0e3ef;
    background: #fff;
    overflow: hidden;
    cursor: default;
    transition: border-color 0.2s, box-shadow 0.2s;
  }

  .subscription-pill:hover {
    border-color: #c5c9dc;
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
  }

  .plan-label {
    padding: 7px 12px;
    background: #2563eb;
    color: #fff;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
  }

  .plan-tier {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: -0.2px;
    line-height: 1;
  }

  .plan-sub {
    font-size: 10px;
    font-weight: 500;
    opacity: 0.75;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .expiry-section {
    padding: 7px 12px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 2px;
  }

  .expiry-top {
    font-size: 10px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: #9399b0;
    line-height: 1;
  }

  .expiry-days {
    font-size: 13px;
    font-weight: 700;
    color: #e67700;
    letter-spacing: -0.2px;
    line-height: 1;
  }

  /* ── Restaurant status ── */
  .restaurant-status {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 14px;
    border-radius: 10px;
    border: 1.5px solid #bbf7d0;
    background: #f0fdf4;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s;
    user-select: none;
  }

  .restaurant-status:hover {
    background: #dcfce7;
    border-color: #86efac;
    box-shadow: 0 2px 8px rgba(34,197,94,0.12);
  }

  .status-indicator {
    position: relative;
    width: 8px;
    height: 8px;
    flex-shrink: 0;
  }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #16a34a;
    position: absolute;
    inset: 0;
  }

  .status-ring {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    border: 2px solid #16a34a;
    position: absolute;
    inset: 0;
    animation: ring-pulse 2s ease-out infinite;
    opacity: 0;
  }

  @keyframes ring-pulse {
    0%   { transform: scale(1); opacity: 0.7; }
    100% { transform: scale(2.6); opacity: 0; }
  }

  .status-text {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }

  .status-sub {
    font-size: 10px;
    font-weight: 500;
    color: #4ade80;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .status-title {
    font-size: 12px;
    font-weight: 700;
    color: #15803d;
    line-height: 1;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  /* ── Notification button ── */
  .notif-btn {
    position: relative;
    width: 40px;
    height: 40px;
    border-radius: 10px;
    border: 1.5px solid #e0e3ef;
    background: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, box-shadow 0.2s, transform 0.15s;
  }

  .notif-btn:hover {
    background: #f5f6fb;
    border-color: #c5c9dc;
    box-shadow: 0 2px 8px rgba(0,0,0,0.07);
  }

  .notif-btn:active { transform: scale(0.95); }

  .notif-btn svg {
    width: 17px;
    height: 17px;
    color: #5b6080;
    transition: color 0.2s;
  }

  .notif-btn:hover svg { color: #2563eb; }

  .notif-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #ef4444;
    border: 2px solid #fff;
  }

  /* ── Demo body filler ── */
  .demo-body {
    flex: 1;
    padding: 28px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .demo-card-row {
    display: flex;
    gap: 16px;
  }

  .demo-card {
    flex: 1;
    background: #fff;
    border-radius: 14px;
    border: 1px solid #e8eaf0;
    padding: 20px 22px;
  }

  .dc-label { font-size: 13px; color: #9399b0; font-weight: 500; margin-bottom: 6px; }
  .dc-value { font-size: 26px; font-weight: 700; color: #1a1d2e; letter-spacing: -0.5px; }
  .dc-sub   { font-size: 12px; color: #16a34a; font-weight: 600; margin-top: 4px; }
</style>
</head>
<body>

<!-- Top bar -->
<div class="demo-topbar">
  <div class="page-title">Restaurant Overview</div>

  <!-- ══ HEADER RIGHT ══ -->
  <div class="header-right">

    <!-- Subscription -->
    <div class="subscription-pill" title="Your current plan">
      <div class="plan-label">
        <span class="plan-tier">Pro</span>
        <span class="plan-sub">Plan</span>
      </div>
      <div class="expiry-section">
        <span class="expiry-top">Expires in</span>
        <span class="expiry-days">18 days</span>
      </div>
    </div>

    <!-- Restaurant Status -->
    <div class="restaurant-status">
      <div class="status-indicator">
        <div class="status-dot"></div>
        <div class="status-ring"></div>
      </div>
      <div class="status-text">
        <span class="status-sub">Restaurant</span>
        <span class="status-title">Open</span>
      </div>
    </div>

    <!-- Notifications -->
    <button class="notif-btn" aria-label="Notifications">
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.9">
        <path stroke-linecap="round" stroke-linejoin="round"
          d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
      </svg>
      <span class="notif-badge"></span>
    </button>

  </div>
</div>

<!-- Demo body -->
<div class="demo-body">
  <div class="demo-card-row">
    <div class="demo-card">
      <div class="dc-label">Today's Revenue</div>
      <div class="dc-value">Rs. 12,450</div>
      <div class="dc-sub">↑ 12% from yesterday</div>
    </div>
    <div class="demo-card">
      <div class="dc-label">Active Orders</div>
      <div class="dc-value">08</div>
      <div class="dc-sub" style="color:#2563eb">Live tracking active</div>
    </div>
    <div class="demo-card">
      <div class="dc-label">Occupied Tables</div>
      <div class="dc-value">5/15</div>
      <div class="dc-sub" style="color:#9399b0; font-weight:500">Standard Capacity</div>
    </div>
  </div>
</div>

</body>
</html>
